<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Test_tg2</title>
    <meta name="description" content="Test_tg2 — сборка Unity WebGL, доступная в браузере и внутри Telegram.">

    <!-- viewport-fit=cover нужен, чтобы canvas доставал до краёв экрана,
         а вырезы/чёлка учитывались через safe-area-inset в CSS. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta property="og:title" content="Test_tg2">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Игра на Unity WebGL — запускается в браузере и внутри Telegram.">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://telegram.org">
    <link rel="stylesheet" href="app/app.css">

    <!-- SDK Telegram. Весь код, который его использует, обёрнут в guard,
         поэтому вне Telegram страница работает как обычный WebGL-хост. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="app/app.js" defer></script>
  </head>
  <body data-state="start">
    <!-- Процедурный анимированный фон (рисует app.js, ассеты не нужны) -->
    <canvas id="bg-fx" aria-hidden="true"></canvas>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1" aria-label="Игровой холст"></canvas>

      <!-- Сюда Unity пишет предупреждения и ошибки -->
      <div id="unity-warning" aria-live="polite"></div>

      <!-- Кнопка паузы: появляется только в игре -->
      <button type="button" id="pause-fab" aria-label="Пауза">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
          <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
        </svg>
      </button>

      <!-- ===== Стартовое меню ===== -->
      <div id="menu-start" role="dialog" aria-labelledby="start-title">
        <div class="card menu-card">
          <h1 id="start-title" class="game-title">Test<span>_tg2</span></h1>
          <p class="game-tagline">Лети сквозь препятствия.<br>Касание — взмах крыльев.</p>

          <button type="button" id="play-button" class="btn btn-lg">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5Z" fill="currentColor"/>
            </svg>
            Играть
          </button>

          <div class="menu-foot">
            <button type="button" id="start-sound-toggle" class="chip" aria-pressed="true">
              <svg class="ico-sound-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/>
                <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
              </svg>
              <span>Звук включён</span>
            </button>
            <span class="version" id="start-version">v1.0.2</span>
          </div>
        </div>
      </div>

      <!-- ===== Экран загрузки (свой вместо заставки Unity) =====
           .solid делает слой полностью непрозрачным на время движкового
           splash — застака Unity не показывается вообще. -->
      <div id="loading" role="status" hidden>
        <div class="card loading-card">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#4da3ff"/>
                  <stop offset="60%" stop-color="#7bc0ff"/>
                  <stop offset="100%" stop-color="#9be8ff"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"/>
            </svg>
            <div class="ring-label">
              <span id="progress-percent" class="ring-percent">0</span>
              <span class="ring-percent-sign">%</span>
            </div>
          </div>

          <p class="loading-hint" id="loading-hint">Загружаем игру…</p>
          <p class="loading-stage" id="progress-size"></p>

          <button type="button" id="retry-button" class="btn" hidden>
            Повторить загрузку
          </button>
        </div>
      </div>

      <!-- ===== Меню паузы ===== -->
      <div id="menu-pause" role="dialog" aria-labelledby="pause-title" hidden>
        <div class="card menu-card">
          <h2 id="pause-title" class="pause-title">Пауза</h2>

          <button type="button" id="resume-button" class="btn btn-lg">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5Z" fill="currentColor"/>
            </svg>
            Продолжить
          </button>

          <div class="btn-row">
            <button type="button" id="restart-button" class="btn btn-ghost">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor"/>
              </svg>
              Заново
            </button>
            <button type="button" id="pause-sound-toggle" class="btn btn-ghost" aria-pressed="true">
              <svg class="ico-sound-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/>
                <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
              </svg>
              <svg class="ico-sound-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/>
                <path d="M17 9l5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
              </svg>
              <span>Звук</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Подсказка повернуть телефон (мобильные, портрет) -->
      <div id="rotate-hint" aria-hidden="true">
        <div class="rotate-card">
          <div class="rotate-phone" aria-hidden="true"></div>
          <p>Поверните телефон вертикально</p>
        </div>
      </div>

      <footer id="unity-footer">
        <button type="button" id="fullscreen-button" class="icon-button" aria-label="Полноэкранный режим"></button>
        <span id="build-title">Test_tg2</span>
      </footer>
    </div>

    <noscript>
      <p id="noscript-warning">Для запуска игры необходимо включить поддержку JavaScript.</p>
    </noscript>
  </body>
</html>
